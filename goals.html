<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Healthy Habits Tracker</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script type="module" src="js/main.js" defer></script>
  <script src="js/inject.js" defer></script>
</head>
<body>

  <!-- Injected Components -->
  <div id="header-container"></div>

  <div class="layout">
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main style="background-color: aquamarine;">
      <section id="goals" style="text-align: center; border:1px solid black; margin: auto;">
        <h2>Your Health Goals</h2>
        <p>Calculate BMI and find your Personalized  goals</p>
        <!-- Goals Content will be dynamically injected here based on BMI -->
      </section>

      <!-- BMI Calculator Section (Feet & Inches) -->
      <section id="bmi-calculator-feet">
        <h2>BMI Calculator (Feet & Inches)</h2>
        <form id="bmi-form-feet">
          <label for="feet">Height (Feet):</label>
          <input type="number" id="feet" placeholder="e.g. 5" required />

          <label for="inches">Height (Inches):</label>
          <input type="number" id="inches" placeholder="e.g. 7" required />

          <label for="weight">Weight (kg):</label>
          <input type="number" id="weight-feet" placeholder="e.g. 70" required />

          <button type="submit">Calculate BMI</button>
        </form>

        <div id="result"></div>
        <div id="goals-list"></div> <!-- This is where health goals will be displayed -->
      </section>
    </main>
  </div>

  <div id="footer-container"></div>

  <script>
    // BMI Calculation using Feet, Inches and kg
    document.getElementById('bmi-form-feet').addEventListener('submit', function(event) {
      event.preventDefault(); // Prevent form from reloading the page

      const feet = parseFloat(document.getElementById('feet').value);
      const inches = parseFloat(document.getElementById('inches').value);
      const weight = parseFloat(document.getElementById('weight-feet').value);

      if (isNaN(feet) || isNaN(inches) || isNaN(weight)) {
        document.getElementById('result').innerText = "Please enter valid values.";
        document.getElementById('goals-list').innerHTML = "";
        return;
      }

      const totalInches = (feet * 12) + inches;
      const heightMeters = totalInches * 0.0254;
      const bmi = weight / (heightMeters * heightMeters);
      const bmiRounded = bmi.toFixed(2);

      let message = `Your BMI is ${bmiRounded}. `;
      let goalsHTML = "";

      if (bmi < 18.5) {
        message += "You are underweight.";
        goalsHTML = `
          <h3>💪 Goals for Underweight:</h3>
          <ul>
            <li>🍽️ Increase calorie intake with nutrient-rich foods</li>
            <li>💪 Strength training to build muscle mass</li>
            <li>🥛 Include dairy, nuts, whole grains, healthy fats</li>
            <li>🍌 Eat frequently: 5–6 meals/day</li>
            <li>📅 Monitor weight weekly</li>
            <li>💧 Stay hydrated (2L water)</li>
          </ul>
        `;
      } else if (bmi >= 18.5 && bmi < 25) {
        message += "You have a normal weight. 🎉";
        goalsHTML = `
          <h3>🌿 Goals for Normal Weight:</h3>
          <ul>
            <li>🚶‍♀️ 8,000–10,000 steps daily</li>
            <li>🥗 Eat a balanced diet (whole grains, veggies, lean proteins)</li>
            <li>💧 Drink 2+ liters of water daily</li>
            <li>😴 Sleep 7–8 hours per night</li>
            <li>🧘‍♂️ Practice mindfulness and mental wellness</li>
            <li>⚖️ Maintain regular health checkups</li>
          </ul>
        `;
      } else if (bmi >= 25 && bmi < 30) {
        message += "You are overweight.";
        goalsHTML = `
          <h3>🔥 Goals for Overweight:</h3>
          <ul>
            <li>🏃‍♂️ Moderate exercise (30–45 min/day)</li>
            <li>🥦 Focus on portion control and reduce processed foods</li>
            <li>📉 Set gradual weight loss goal (0.5–1 kg/week)</li>
            <li>📱 Use a food or activity tracker app</li>
            <li>💧 Drink plenty of water (2.5L+)</li>
            <li>🛌 Improve sleep quality and manage stress</li>
          </ul>
        `;
      } else {
        message += "You are obese.";
        goalsHTML = `
          <h3>🚨 Goals for Obesity:</h3>
          <ul>
            <li>🏥 Consult a healthcare provider for a tailored plan</li>
            <li>🥗 Adopt a low-calorie, nutrient-dense diet</li>
            <li>🏋️‍♀️ Start with low-impact exercises (e.g., walking, swimming)</li>
            <li>📉 Target small, consistent weight reduction milestones</li>
            <li>🧠 Focus on behavioral and habit changes</li>
            <li>👥 Consider support groups or professional counseling</li>
          </ul>
        `;
      }

      document.getElementById('result').innerText = message;
      document.getElementById('goals-list').innerHTML = goalsHTML;
    });
  </script>

</body>
</html>
