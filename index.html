<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthyHabits Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>

  <style>
    body {
      background-color: #282c34;
      color:white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      /* background-image: ; */
      background-size: cover;
    }

    .container {
      
      text-align: center;
    }

    .start-button {
      background-color: #61dafb;
      color: #282c34;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }

    .start-button:hover {
      background-color: #21a1f1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="color: aliceblue;">Healthy Habits Tracker</h1>
    <p>Your personal assistant. Make small habits and big goals achievable.</p>
    <button class="start-button" id="start-button">Start</button>
  </div>

</body>
</html>
