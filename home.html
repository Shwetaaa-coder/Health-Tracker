<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Layout</title>
  
  <!-- Chart.js (optional, still included if needed later) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      height: 100vh;
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      transition: background-color 0.3s;
    }

    .sidebar {
      width: 220px;
      background: #2c3e50;
      color: white;
      display: flex;
      flex-direction: column;
      padding: 20px;
      transition: width 0.3s ease;
    }

    .sidebar h2 {
      margin-bottom: 30px;
      font-size: 24px;
    }

    .sidebar a {
      color: white;
      text-decoration: none;
      margin: 10px 0;
      padding: 8px;
      border-radius: 4px;
      transition: background 0.3s;
    }

    .sidebar a:hover {
      background: #34495e;
    }

    .logout-btn {
      margin-top: auto;
      padding: 10px;
      background-color: #e74c3c;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-size: 16px;
    }

    .logout-btn:hover {
      background-color: #c0392b;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      background: #ecf0f1;
      padding: 15px 20px;
      border-bottom: 1px solid #ccc;
    }

    .header h3 {
      font-size: 20px;
    }

    .content {
      flex: 1;
      padding: 20px;
    }

    .footer {
      background: #bdc3c7;
      padding: 10px 20px;
      text-align: center;
      font-size: 14px;
    }

    /* Dark mode styles */
    .dark-mode {
      background-color: #2c3e50;
      color: white;
    }

    .sidebar.dark-mode {
      background-color: #34495e;
    }

    .header.dark-mode {
      background-color: #1a242f;
    }

    .footer.dark-mode {
      background-color: #2c3e50;
    }

    .main.dark-mode {
      background-color: #2c3e50;
      color: white;
    }

    /* Toggle Switch Style */
    .switch-container {
      margin-top: 15px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #f39c12;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        flex-direction: row;
        justify-content: space-around;
        padding: 10px 0;
      }

      .main {
        padding: 10px;
      }

      .footer {
        font-size: 12px;
      }

      .header h3 {
        font-size: 18px;
      }

      .content {
        padding: 10px;
      }

      .sidebar a {
        margin: 5px;
        padding: 5px;
      }
    }

    @media (max-width: 480px) {
      .sidebar {
        padding: 5px;
        font-size: 14px;
      }

      .sidebar a {
        font-size: 12px;
      }
    }

    .sidebar:hover {
      width: 250px;
    }



    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      margin: 30px auto;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card h3 {
      margin-bottom: 15px;
      font-size: 20px;
      color: #2c3e50;
    }

    /* Form Part of the Card */
    .habit-form {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .habit-form label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    .habit-form input,
    .habit-form select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .habit-form button {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      width: 100%;
    }

    .habit-form button:hover {
      background-color: #219150;
    }

    /* Habit Log Part of the Card */
    .habit-log {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .habit-log ul {
      list-style: none;
      padding-left: 0;
    }

    .habit-log li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ecf0f1;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      transition: background-color 0.2s ease;
    }

    .habit-log li:hover {
      background-color: #dfe6e9;
    }

    .habit-log input[type="checkbox"] {
      transform: scale(1.2);
      cursor: pointer;
    }

    /* Progress Bar */
    .progress-bar {
      width: 100%;
      background-color: #ddd;
      border-radius: 5px;
      margin-top: 10px;
      height: 10px;
    }

    .progress-bar span {
      display: block;
      height: 100%;
      background-color: #27ae60;
      border-radius: 5px;
    }

    /* Dark Mode Styles */
    .dark-mode {
      background-color: #2c3e50;
      color: white;
    }

    .dark-mode .habit-form,
    .dark-mode .habit-log {
      background-color: #34495e;
      color: white;
    }

    .dark-mode .habit-form input,
    .dark-mode .habit-form select {
      background-color: #2c3e50;
      color: white;
      border: 1px solid #555;
    }

    .dark-mode button {
      background-color: #f39c12;
      color: white;
    }

    .dark-mode button:hover {
      background-color: #e67e22;
    }

    /* Media Queries for Mobile */
    @media (max-width: 768px) {
      .card {
        padding: 15px;
      }

      .habit-form input,
      .habit-form select {
        font-size: 14px;
      }

      .habit-form button {
        padding: 10px 18px;
      }
    }
  
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>Healthy Habits</h2>
    <a href="#">Dashboard</a>
    <a href="#">Analytics</a>
    <a href="#">Reports</a>
    <a href="#">Settings</a>
    <a href="#">Profile</a>
    <button class="logout-btn">Logout</button>

    <!-- Dark Mode Toggle -->
    <div class="switch-container">
      <label style="margin-right: 8px;">Dark</label>
      <label class="switch">
        <input type="checkbox" id="darkToggle" onchange="toggleDarkMode()">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <h3>Dashboard</h3>
      <p style="margin-top: 5px; font-size: 14px; color: #555;">
        Track your daily routines, stay consistent, and build better habits for a healthier life.
      </p>
    </div>

    <div class="content">
      <div class="card">

        <!-- Form Part -->
        <div class="habit-form">
          <h3>Create a New Habit</h3>
          <form id="habitForm">
            <label for="category">Category:</label><br>
            <select id="category" name="category" required>
              <option value="">Select</option>
              <option value="Fitness">Fitness</option>
              <option value="Hydration">Hydration</option>
              <option value="Sleep">Sleep</option>
              <option value="Meditation">Meditation</option>
            </select><br><br>
    
            <label for="habitName">Habit Name:</label><br>
            <input type="text" id="habitName" name="habitName" placeholder="e.g., Morning Jog" required><br><br>
    
            <label for="goalType">Goal Type:</label><br>
            <select id="goalType" name="goalType" required>
              <option value="">Select</option>
              <option value="Daily">Daily</option>
              <option value="Weekly">Weekly</option>
            </select><br><br>
    
            <label for="goalDetail">Goal Detail:</label><br>
            <input type="text" id="goalDetail" name="goalDetail" placeholder="e.g., 8 glasses, 3x/week" required><br><br>
    
            <button type="submit">Add Habit</button>
          </form>
        </div>
    
        <!-- Habit Log Part -->
        <div class="habit-log">
          <h3>Your Habits</h3>
          <ul>
            <li>
              <span>Drink 8 glasses of water</span>
              <input type="checkbox" id="habit1" />
              <label for="habit1"></label>
            </li>
            <!-- More habit log items can be added dynamically here -->
          </ul>
        </div>
        
      </div>
    </div>

    <!-- <div class="footer">
      © 2025 YourCompany. All rights reserved.
    </div> -->
  </div>

  <script>
    function toggleDarkMode() {
      const isDark = document.getElementById('darkToggle').checked;

      document.body.classList.toggle('dark-mode', isDark);
      document.querySelector('.sidebar').classList.toggle('dark-mode', isDark);
      document.querySelector('.header').classList.toggle('dark-mode', isDark);
      document.querySelector('.footer').classList.toggle('dark-mode', isDark);
      document.querySelector('.main').classList.toggle('dark-mode', isDark);
    }
  </script>

</body>
</html>
